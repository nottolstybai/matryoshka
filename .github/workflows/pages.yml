# Выкладка web/ на GitHub Pages. Нужен публичный репозиторий и
# Settings → Pages → Source: GitHub Actions. Если хостинг — Vercel, файл можно удалить.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check test
      # Метка версии на JS/CSS, чтобы после выкладки браузер не смешал новые модули со старыми из кеша.
      - run: node tools/stamp.mjs "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
